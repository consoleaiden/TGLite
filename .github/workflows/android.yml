name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install build components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" > /dev/null

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      # 先做静态与逻辑验证，几十秒就能拦住大部分回归，
      # 不用等 Gradle 跑完才发现问题
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Verify polyfills & transport (crypto / TCP / proxy tunnel)
        run: npm run verify

      - name: Run unit tests
        run: npx jest

      - name: Bundle JS (Metro smoke test)
        run: |
          mkdir -p /tmp/smoke
          npx react-native bundle \
            --platform android \
            --dev false \
            --minify true \
            --entry-file index.js \
            --bundle-output /tmp/smoke/index.android.bundle \
            --assets-dest /tmp/smoke/assets

      - name: Inject api_id / api_hash (optional secrets)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: node scripts/gen-config.js

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          ALIAS="${ANDROID_KEY_ALIAS:-tglite}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "[keystore] 使用 Secrets 中提供的签名文件"
            mkdir -p android/keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.keystore
            PASSWORD="${KEYSTORE_PASSWORD:?需要同时提供 ANDROID_KEYSTORE_PASSWORD}"
          else
            echo "[keystore] 未提供签名文件，自动生成一个用于 CI 的签名文件"
            mkdir -p android/keystore
            PASSWORD="${KEYSTORE_PASSWORD:-tglite-ci}"
            keytool -genkeypair -v \
              -keystore android/keystore/release.keystore \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$PASSWORD" -keypass "$PASSWORD" \
              -dname "CN=TG Lite, OU=Self Use, O=TG Lite, L=Shenzhen, ST=Guangdong, C=CN"
          fi
          cat > android/keystore.properties <<EOF
          storeFile=../keystore/release.keystore
          storePassword=$PASSWORD
          keyAlias=$ALIAS
          keyPassword=$PASSWORD
          EOF
          echo "[keystore] android/keystore.properties 已生成"

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Show APK info
        run: |
          ls -lh android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release.apk "tglite-${GITHUB_REF_NAME//\//-}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tglite-apk-${{ github.sha }}
          path: tglite-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tglite-*.apk
          generate_release_notes: true
