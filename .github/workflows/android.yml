name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble release APK
    # 固定小版本：ubuntu-latest 会按 GitHub 的节奏静默跳到大版本
    # （2026-10 起迁往 26.04），镜像一换 SDK/NDK 预装版本就变，
    # 构建会莫名其妙地挂。等验证稳定后再手动升。
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      # 显式关闭 Gradle daemon：CI 是单次进程，daemon 只会白占内存
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
      # 固定时区：runner 默认 UTC，而本机开发常在 UTC+8。
      # 时间相关的测试/快照在不同时区会出现「本地绿、CI 红」，
      # 这里统一成 UTC，让本地与 CI 行为一致（时区敏感的用例
      # 应自行用本地时间构造输入，而不是依赖运行机器时区）。
      TZ: UTC
      # 缓存归档里记录的属主可能是 root（归档方解包时会尝试 chown），
      # 而 actions/cache 是以 runner 普通用户身份调 tar 解包的，chown 必然失败：
      #   tar: ...: Cannot utime: Operation not permitted
      #   tar: ...: Cannot change mode to rwxr-xr-x: Operation not permitted
      #   tar: Exiting with failure status due to previous errors   ← exit code 2
      # --no-same-owner 让解包出来的文件归当前用户所有，不再尝试改属主。
      # GNU tar 会把这个环境变量当作默认命令行选项，且显式参数仍可覆盖它。
      TAR_OPTIONS: --no-same-owner
      # NDK 缓存的落地中转目录。故意不用镜像里那个 root 属主的 SDK 目录，
      # 见下方 "Cache Android NDK" 步骤的说明。
      NDK_CACHE_DIR: ${{ github.workspace }}/.ndk-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 不再使用 android-actions/setup-android：
      # 它已停止维护，且内部会执行 `sdkmanager "tools"`，
      # 而 `tools` 包已被 Google 从 SDK 仓库移除，导致 sdkmanager 退出码 1、
      # 整个 job 在建连之前就失败。
      # ubuntu-24.04 镜像自带完整 SDK，直接校验并按需补齐即可。
      - name: Verify Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          test -d "$ANDROID_HOME" || { echo "::error::ANDROID_HOME 不存在"; exit 1; }
          test -x "$ANDROID_HOME/platform-tools/adb" || { echo "::error::缺 platform-tools"; exit 1; }
          ls -1 "$ANDROID_HOME/ndk" 2>/dev/null || echo "(未预装 NDK)"
          echo "--- 已装 platforms ---"
          ls -1 "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "--- 已装 build-tools ---"
          ls -1 "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Accept SDK licenses
        run: |
          set -euo pipefail
          # 不写死 cmdline-tools/latest：镜像里目录名随版本变（12.0 / 16.0 …）。
          # 用 glob 逐层探，比 find 递归更稳，也更好排查。
          SDKMANAGER=""
          for cand in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            [ -x "$cand" ] && SDKMANAGER="$cand"
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager"
            ls -R "$ANDROID_HOME/cmdline-tools" 2>/dev/null | head -30 || true
            exit 1
          fi
          echo "[sdk] sdkmanager = $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          # 先授权再装包：否则 Gradle 会在构建末期报 license not accepted，
          # 错误信息离真正原因很远，很难查。
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          echo "[sdk] licenses 已处理"

      # 缓存 NDK：Android 官方 NDK 包约 630MB，
      # 镜像是「随镜像更新滚动」的，某次更新后就可能不再预装项目锁定的版本，
      # 每次重下很浪费时间。键里带上版本号，升 NDK 时自动换缓存。
      #
      # 为什么缓存目录不是 $ANDROID_HOME/ndk 本体？
      # 之前直接缓存 /usr/local/lib/android/sdk/ndk（镜像预装路径），
      # 恢复时必然报：
      #   Failed to restore: "/usr/bin/tar" failed with error:
      #   The process '/usr/bin/tar' failed with exit code 2
      # 原因是那棵目录树属主是 root/packer，而 actions/cache 以 runner 用户
      # 调 `tar -P -C <原路径>` 解包，归档里带着 root 属主信息，
      # tar 会去 chown/chmod/chutime，全都 EPERM：
      #   Cannot utime: Operation not permitted
      #   Cannot change mode to rwxr-xr-x: Operation not permitted
      # 解包一旦报错，actions/cache 就把整次恢复判为失败 → 缓存等于没用，
      # 每次构建仍要重装 630MB。runner-images / cypress 都有同类 issue。
      #
      # 改成缓存一个我们自己创建的、归 runner 所有的中转目录：
      # 属主一致，tar 解包不会碰到权限问题；再由下一步把内容「拷」进 SDK。
      # 这条路径在 workspace 下，默认就属于 runner。
      # 不写 ${{ env.ANDROID_HOME }}：actions/cache 的 with 不做运行时 env 插值，
      # 取到的是空值，路径会变成 "/ndk" 这种错误位置。
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ndk-cache
          key: ndk-${{ runner.os }}-26.1.10909125

      # 项目锁定 NDK 26.1.10909125（RN 0.75 模板的对应版本）。
      # 注意不要把这里改成「升级到镜像预装的最新版」——RN 与 NDK 的
      # libc++ ABI 是对齐的，跨大版本容易在链接期报 std::__ndk1 未定义符号。
      # 所以策略是：缺哪个装哪个，装完复验。
      - name: Ensure required SDK components
        run: |
          set -euo pipefail
          # 路径由上一步写入 GITHUB_ENV
          : "${SDKMANAGER:?上一步未导出 SDKMANAGER}"
          # NDK 缓存中转目录来自 job env。这里显式校验：set -u 下它若缺失，
          # 原生报错是一句没头没尾的 "NDK_CACHE_DIR: unbound variable"，
          # 排查时看不出是 env 漏配。给一句能直接指向原因的提示。
          : "${NDK_CACHE_DIR:?job env 缺少 NDK_CACHE_DIR，检查 workflow 顶部的 env 块}"

          # grep -oP 需要 PCRE（GNU grep 默认带），失败时退回 sed，双保险
          NDK_VERSION="$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' android/build.gradle 2>/dev/null | head -1 || true)"
          if [ -z "$NDK_VERSION" ]; then
            NDK_VERSION="$(sed -n 's/.*ndkVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' android/build.gradle | head -1)"
          fi
          if [ -z "$NDK_VERSION" ]; then
            echo "::error::无法从 android/build.gradle 解析出 ndkVersion"
            exit 1
          fi
          echo "[sdk] android/build.gradle 声明 ndkVersion=$NDK_VERSION"

          NEEDED=""
          for pkg in \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          do
            # 目录已存在就跳过，省掉一轮网络往返
            case "$pkg" in
              platform-tools)   path="$ANDROID_HOME/platform-tools" ;;
              platforms\;*)     path="$ANDROID_HOME/platforms/${pkg#platforms;}" ;;
              build-tools\;*)   path="$ANDROID_HOME/build-tools/${pkg#build-tools;}" ;;
            esac
            if [ -d "$path" ]; then
              echo "[sdk] 已存在，跳过 $pkg"
            else
              echo "[sdk] 需要安装 $pkg"
              NEEDED="$NEEDED $pkg"
            fi
          done

          # ---- NDK：优先吃缓存中转目录，其次现装 ----
          # $NDK_CACHE_DIR 由 job env 提供（workspace 下的 .ndk-cache）。
          # 命中缓存时里面已经有 ndk/<版本>/，直接拷进 SDK，
          # 省掉 630MB 下载；未命中时照常装，装完再拷回中转目录供下次缓存。
          NDK_MISSING=0
          if [ -n "${NDK_VERSION:-}" ]; then
            if [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
              echo "[sdk] NDK $NDK_VERSION 已存在于 SDK 中"
            elif [ -d "$NDK_CACHE_DIR/ndk/$NDK_VERSION" ]; then
              echo "[sdk] 命中 NDK 缓存，从 $NDK_CACHE_DIR 拷入 SDK"
              mkdir -p "$ANDROID_HOME/ndk"
              # cp -a 保留符号链接与可执行位：NDK 里有大量 symlink，
              # 用 cp -r 会把链接解引用成实体文件，体积暴涨且可能失效。
              # 目标目录属主是我们自己（新建的），不会踩 root 属主的权限坑。
              cp -a "$NDK_CACHE_DIR/ndk/$NDK_VERSION" "$ANDROID_HOME/ndk/"
              echo "[sdk] NDK 缓存拷贝完成"
            else
              echo "[sdk] NDK $NDK_VERSION 既不在 SDK 也不在缓存，需要安装"
              NEEDED="$NEEDED ndk;$NDK_VERSION"
              NDK_MISSING=1
            fi
          fi

          if [ -z "$NEEDED" ]; then
            echo "[sdk] 组件齐全，无需安装"
            exit 0
          fi

          # 保留完整输出：装不上时日志里要能看见到底是哪个包、什么原因
          # shellcheck disable=SC2086
          "$SDKMANAGER" --install $NEEDED

          # 装完复验，避免"sdkmanager 报成功但目录其实没生成"
          if [ -n "${NDK_VERSION:-}" ] && [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            echo "::error::NDK $NDK_VERSION 安装后仍不存在，请检查上面的 sdkmanager 输出。"
            echo "当前 $ANDROID_HOME/ndk 下可用："
            ls -1 "$ANDROID_HOME/ndk" 2>/dev/null || true
            exit 1
          fi

          # 现装出来的 NDK 回填到缓存中转目录，供 cache 步骤在 job 结束时保存。
          # 只回填，不动 SDK 里的原件——SDK 那棵树的属主不是 runner，
          # 对它做任何写属主的操作都会再次引入 tar 解包失败的老问题。
          if [ "${NDK_MISSING:-0}" = "1" ] && [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            echo "[sdk] 回填 NDK 到缓存中转目录 $NDK_CACHE_DIR"
            mkdir -p "$NDK_CACHE_DIR/ndk"
            cp -a "$ANDROID_HOME/ndk/$NDK_VERSION" "$NDK_CACHE_DIR/ndk/"
            echo "[sdk] 回填完成，下次构建将命中缓存"
          fi
          echo "[sdk] 组件安装完成"

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      # 先做静态与逻辑验证，几十秒就能拦住大部分回归，
      # 不用等 Gradle 跑完才发现问题
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Verify polyfills & transport (crypto / TCP / proxy tunnel)
        run: npm run verify

      - name: Run unit tests
        run: npx jest

      - name: Bundle JS (Metro smoke test)
        run: |
          mkdir -p /tmp/smoke
          npx react-native bundle \
            --platform android \
            --dev false \
            --minify true \
            --entry-file index.js \
            --bundle-output /tmp/smoke/index.android.bundle \
            --assets-dest /tmp/smoke/assets

      - name: Inject api_id / api_hash (optional secrets)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: node scripts/gen-config.js

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ALIAS="${ANDROID_KEY_ALIAS:-tglite}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "[keystore] 使用 Secrets 中提供的签名文件"
            mkdir -p android/keystore
            # printf 而非 echo：echo 会在部分 shell 下追加换行，破坏 base64
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > android/keystore/release.keystore
            PASSWORD="${KEYSTORE_PASSWORD:?需要同时提供 ANDROID_KEYSTORE_PASSWORD}"
          else
            echo "[keystore] 未提供签名文件，自动生成一个用于 CI 的签名文件"
            echo "::warning::缺少 ANDROID_KEYSTORE_BASE64，本次 APK 为一次性签名，无法覆盖升级"
            mkdir -p android/keystore
            PASSWORD="${KEYSTORE_PASSWORD:-tglite-ci}"
            keytool -genkeypair -v \
              -keystore android/keystore/release.keystore \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$PASSWORD" -keypass "$PASSWORD" \
              -dname "CN=TG Lite, OU=Self Use, O=TG Lite, L=Shenzhen, ST=Guangdong, C=CN"
          fi
          cat > android/keystore.properties <<EOF
          storeFile=../keystore/release.keystore
          storePassword=$PASSWORD
          keyAlias=$ALIAS
          keyPassword=$PASSWORD
          EOF
          echo "[keystore] android/keystore.properties 已生成"

      - name: Build release APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Show APK info
        run: |
          set -euo pipefail
          ls -lh android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release.apk "tglite-${GITHUB_REF_NAME//\//-}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tglite-apk-${{ github.sha }}
          path: tglite-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tglite-*.apk
          generate_release_notes: true
